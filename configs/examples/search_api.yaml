# Standalone CIF search through an OpenAI-compatible endpoint.
# Set base_url and provide the served model name with --models.
experiment:
  name: null
  output_dir: results/examples/search
  seed: 42
models: []
target_model:
  type: api
  base_url: http://localhost:8000/v1
  api_key_env: TARGET_API_KEY
  max_new_tokens: 2048
  temperature: 1.0
bare_requests:
  data_path: data/constrained_completion/bare_requests.jsonl
  limit: null
  category: constrained_completion
skills:
  dictionary_path: skills/constrained_completion/skill_dictionary.json
  category: null
  mis_size: 8
search:
  budget: 1000
  target_edge_cases: 50
  diminishing_returns: 200
  batch_size: 4
  max_compositions: 3
ucb:
  prior_alpha: 0.3
  prior_beta: 0.7
  c: 1.0
  skill_method: thompson
skill_count:
  max_count: 4
  bare_request_bias: 3.0
  lower_bound: 1
  top_k: 3
  top_p: 0.9
  alpha: 0.05
  beta: 0.1
composer:
  type: template
evaluator:
  coarse_n: 15
  fine_n: 25
  coarse_range:
  - 0.3
  - 0.7
  fine_range:
  - 0.45
  - 0.55
judge:
  type: constraint
