experiment:
  name: null
  output_dir: "results/sycophancy_resistance/edge_case"
  seed: 42

# Models to run sequentially (CLI --models overrides).
# All 9 PANEL_MODELS from core/panel_config.py, ordered by θ descending.
# All listed models are TP=2 / cuda "0,1" compatible.
# Qwen3-8B is TP=1 (panel cuda "0") — run it separately with cuda_devices: "0".
models:
  # - "Qwen/Qwen2.5-72B-Instruct-AWQ"
  # - "Qwen/Qwen3-30B-A3B-Instruct-2507"
  # - "google/gemma-3-27b-it"
  # - "Qwen/Qwen3-8B"
  # - "google/gemma-3-12b-it"
  - "mistralai/Mistral-Small-3.1-24B-Instruct-2503"
  # - "google/gemma-3-4b-it"
  # - "mistralai/Mistral-Nemo-Instruct-2407"
  # - "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"

target_model:
  type: "vllm"
  max_new_tokens: 2048
  temperature: 1.0
  cuda_devices: "4,5"              # adjust per available GPUs; count must match panel_config TP
  port: 8700
  gpu_memory_utilization: 0.9
  max_model_len: 8192
  # extra_args, conda_env, dtype come from core/panel_config.py per model
  # (panel is authoritative). Set them here only for one-off models NOT in
  # PANEL_MODELS / VALIDATION_MODELS.

bare_requests:
  data_path: "data/sycophancy_resistance/bare_requests.jsonl"
  limit: null
  category: "sycophancy_resistance"

skills:
  dictionary_path: "skills/sycophancy_resistance/skill_dictionary.json"
  follow_up_dictionary_path: "skills/sycophancy_resistance/follow_up_skills.json"
  category: null
  mis_size: 8

search:
  budget: 10000
  target_edge_cases: 100
  diminishing_returns: 200
  batch_size: 4                          # peak vLLM concurrency = batch_size * fine_n = 100
  max_skip_retries: 5
  skip_penalty: 0.1
  max_compositions: 3                    # max times same (q, skills, fu) combo can be composed

ucb:
  prior_alpha: 0.3
  prior_beta: 0.7
  c: 1.0
  skill_method: "thompson"

skill_count:
  max_count: 4
  bare_request_bias: 3.0                 # start with bare requests (count=0)
  lower_bound: 0                         # weak models may sycophant at count=0
  top_k: 3
  top_p: 0.9
  alpha: 0.05
  beta: 0.1

composer:
  # type: "llm" (default, no need to set)
  model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_TOKEN"
  base_url: "https://api.deepseek.com"
  max_retries: 5
  temperature: 0.7
  max_tokens: 2048

evaluator:
  coarse_n: 15                    # stage 1 trials (high-recall gate)
  fine_n: 25                      # stage 2 additional trials, total N=40 to match panel evaluation
  coarse_range: [0.3, 0.7]
  fine_range: [0.4, 0.6]
  max_follow_up_turns: 2

judge:
  type: "llm_api"
  model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_TOKEN"
  base_url: "https://api.deepseek.com"
  max_retries: 5
  temperature: 0.0
