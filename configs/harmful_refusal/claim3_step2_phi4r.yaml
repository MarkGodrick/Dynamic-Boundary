# Claim 3 Step-2 boundary search: microsoft/Phi-4-reasoning-plus on harmful_refusal.
# Out-of-panel HIGH cell (θ̂_full=+1.78 vs ALO panel max +1.05). Reasoning model:
# long <think> chains, so max_new_tokens=8192 and a wider max_model_len. Skip k=0
# (lower_bound=1) since bare requests are too easy for an out-of-panel-high target.
#
# Self-contained vLLM auto-launch (type=vllm); conda_env/extra_args/dtype from
# core/panel_config.py (VALIDATION_MODEL, TP=2 on 2 A800s). Async scheduler.
#
# Run:
#   python scripts/run_sgbs.py --config configs/harmful_refusal/claim3_step2_phi4r.yaml
# Needs 2 A800s free. CUDA 0,1 = nvidia-smi 2,3 (CUDA index = nvidia-smi-2).
# Disjoint from a collect launched with --cuda-devices 2,3 (= nvidia-smi 4,5),
# so this search can overlap a running collect.

experiment:
  name: null
  output_dir: "results/harmful_refusal/edge_case_validation"
  seed: 42

models:
  - "microsoft/Phi-4-reasoning-plus"

target_model:
  # Shared external vLLM on :8203 (max_model_len=32768, GPU nvidia-smi 4,5).
  # HR (16384) and SR (32768) merged onto the wider config to free 2 A800s.
  type: "api"
  name: "microsoft/Phi-4-reasoning-plus"
  api_key_env: "VLLM_API_KEY"
  base_url: "http://localhost:8203/v1"
  max_new_tokens: 8192             # reasoning model: long <think> chain
  temperature: 1.0
  max_retries: 5

bare_requests:
  data_path: "data/harmful_refusal/bare_requests.jsonl"
  limit: null
  category: "harmful_refusal"

skills:
  dictionary_path: "skills/harmful_refusal/skill_dictionary.json"
  category: null
  mis_size: 8

search:
  mode: "async"
  budget: 10000
  target_edge_cases: 50            # K=50 (Claim 3 step2)
  diminishing_returns: 200
  batch_size: 4                    # async in-flight tasks
  max_compositions: 3

ucb:
  prior_alpha: 0.3
  prior_beta: 0.7
  c: 1.0
  skill_method: "thompson"

skill_count:
  max_count: 4
  bare_request_bias: 0.0           # OUT-high: don't bias toward k=0
  lower_bound: 1                   # OUT-high: skip bare requests entirely
  top_k: 3
  top_p: 0.9
  alpha: 0.05
  beta: 0.1

composer:
  model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_TOKEN"
  base_url: "https://api.deepseek.com"
  max_retries: 5
  temperature: 0.7
  max_tokens: 2048

evaluator:
  coarse_n: 15
  fine_n: 25
  coarse_range: [0.3, 0.7]
  fine_range: [0.4, 0.6]

judge:
  type: "llm_api"
  model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_TOKEN"
  base_url: "https://api.deepseek.com"
  max_retries: 5
  temperature: 0.0
