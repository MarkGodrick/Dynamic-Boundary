experiment:
  name: null                      # auto-generated if null
  output_dir: "results/"
  seed: 42

# Models to run sequentially (CLI --models overrides).
models:
  - "deepseek-ai/DeepSeek-R1-Distill-Llama-70B"

target_model:
  device: "auto"
  dtype: "bf16"
  type: "hf"                       # "hf" (local HuggingFace) or "api"
  max_new_tokens: 2048
  temperature: 1.0

bare_requests:
  data_path: "data/harmful_refusal/bare_requests.jsonl"
  limit: null                     # null=all, int=limit for testing
  category: "harmful_refusal"     # harmful_refusal | constrained_completion | over_refusal | sycophancy_resistance

skills:
  dictionary_path: "skills/harmful_refusal/skill_dictionary.json"
  category: null                  # null=all; set to filter by category
  mis_size: 8                     # max independent set size (skill count upper bound)

search:
  budget: 1000                    # max rounds
  target_edge_cases: 10           # K: stop when this many found
  diminishing_returns: 100         # R: stop after R rounds with no new edge case
  max_compositions: 3              # max times same (q, skills, fu) combo can be composed

ucb:
  prior_alpha: 0.3                # Beta prior success pseudo-count
  prior_beta: 0.7                 # Beta prior failure pseudo-count
  c: 1.0                          # exploration coefficient (bare request UCB only)
  skill_method: "thompson"        # "thompson" or "ucb" (for ablation)

skill_count:
  max_count: 4                    # logit array size (count 0..max_count-1)
  bare_request_bias: 3.0          # initial logit for count=0
  top_k: 3                        # top-k sampling
  top_p: 0.9                      # nucleus sampling threshold
  alpha: 0.05                     # failure decay coefficient
  beta: 0.1                       # directional boost coefficient

composer:
  model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_TOKEN"
  base_url: "https://api.deepseek.com"
  max_retries: 5
  temperature: 0.7
  max_tokens: 2048

evaluator:
  coarse_n: 5                     # stage 1 trials
  fine_n: 10                      # stage 2 additional trials
  coarse_range: [0.1, 0.9]
  fine_range: [0.3, 0.7]

judge:
  type: "llm_api"                 # "keyword" or "llm_api"
  model: "deepseek-chat"
  api_key_env: "DEEPSEEK_API_TOKEN"
  base_url: "https://api.deepseek.com"
  max_retries: 5
  temperature: 0.0