# Claim 3 Step-2 boundary search: tiiuae/Falcon-H1R-7B on constrained_completion.
# Out-of-panel HIGH cell (θ̂_full=+1.38 vs ALO panel max +0.96): satisfies
# constraints too reliably on the anchor set. CIF is fully rule-based — template
# composer (deterministic constraint injection, no API) and constraint judge
# (deterministic check, no API). lower_bound=1 is the CIF default (at least one
# constraint must apply, so there are no bare requests).
#
# Self-contained vLLM auto-launch; conda_env=vllm + extra_args (DP=2,
# enforce-eager) from core/panel_config.py (VALIDATION_MODEL, 4 A800s). Async.
#
# Run:
#   python scripts/run_sgbs.py --config configs/constrained_completion/claim3_step2_falcon.yaml
# Needs the 4 A800s free (cuda 0,1,2,3) — do NOT overlap a running collect.

experiment:
  name: null
  output_dir: "results/constrained_completion/claim3_step2_search"
  seed: 42

models:
  - "tiiuae/Falcon-H1R-7B"

target_model:
  type: "vllm"
  max_new_tokens: 8192
  temperature: 1.0
  cuda_devices: "2,3"          # panel_config DP=2; the 4 A800s
  port: 8205
  gpu_memory_utilization: 0.9
  max_model_len: 16384
  # conda_env, extra_args, dtype filled in from core/panel_config.py.

bare_requests:
  data_path: "data/constrained_completion/bare_requests.jsonl"
  limit: null
  category: "constrained_completion"

skills:
  dictionary_path: "skills/constrained_completion/skill_dictionary.json"
  category: null
  mis_size: 8

search:
  mode: "async"
  budget: 10000
  target_edge_cases: 50            # K=50 (Claim 3 step2)
  diminishing_returns: 200
  batch_size: 4                    # async in-flight tasks
  max_compositions: 3

ucb:
  prior_alpha: 0.3
  prior_beta: 0.7
  c: 1.0
  skill_method: "thompson"

skill_count:
  max_count: 4
  bare_request_bias: 3.0
  lower_bound: 1                   # CIF default: at least 1 constraint
  top_k: 3
  top_p: 0.9
  alpha: 0.05
  beta: 0.1

composer:
  type: "template"                 # rule-based constraint composer (no API)

evaluator:
  coarse_n: 15
  fine_n: 25
  coarse_range: [0.3, 0.7]
  fine_range: [0.45, 0.55]

judge:
  type: "constraint"               # deterministic rule-based check (no API)
