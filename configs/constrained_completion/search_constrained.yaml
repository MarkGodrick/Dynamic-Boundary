experiment:
  name: null
  output_dir: "results/constrained_completion/edge_case"
  seed: 42

# Models to run sequentially. Each name is dispatched as fresh / resume / skip
# based on whether a matching {model_short}_{category}_<timestamp> dir exists
# under experiment.output_dir. CLI --models overrides this list.
models:
  - "Qwen/Qwen2.5-72B-Instruct-AWQ"
  - "Qwen/Qwen3-30B-A3B-Instruct-2507"
  - "google/gemma-3-27b-it"
  - "Qwen/Qwen3-8B"
  - "google/gemma-3-12b-it"
  - "mistralai/Mistral-Small-3.1-24B-Instruct-2503"
  - "google/gemma-3-4b-it"
  - "mistralai/Mistral-Nemo-Instruct-2407"
  - "deepseek-ai/DeepSeek-R1-Distill-Llama-8B"

target_model:
  type: "vllm"
  max_new_tokens: 2048
  temperature: 1.0
  cuda_devices: "2,3"             # adjust per available GPUs; count must match panel_config TP
  port: 8200
  gpu_memory_utilization: 0.9
  max_model_len: 8192
  # extra_args, conda_env, dtype come from core/panel_config.py per model
  # (panel is authoritative). Set them here only for one-off models NOT in
  # PANEL_MODELS / VALIDATION_MODELS.

bare_requests:
  data_path: "data/constrained_completion/bare_requests.jsonl"
  limit: null
  category: "constrained_completion"

skills:
  dictionary_path: "skills/constrained_completion/skill_dictionary.json"
  category: null
  mis_size: 8

search:
  budget: 10000
  target_edge_cases: 100
  diminishing_returns: 200
  batch_size: 4                        # 1 = sequential, >1 = parallel eval
  max_compositions: 3                  # max times same (q, skills, fu) combo can be composed

ucb:
  prior_alpha: 0.3
  prior_beta: 0.7
  c: 1.0                              # only used for bare request UCB
  skill_method: "thompson"             # "thompson" or "ucb" (for ablation)

skill_count:
  max_count: 4
  bare_request_bias: 3.0
  lower_bound: 1                     # at least 1 constraint (no bare requests)
  top_k: 3
  top_p: 0.9
  alpha: 0.05
  beta: 0.1

composer:
  type: "template"                   # "llm" (API) or "template" (rule-based)

evaluator:
  coarse_n: 15                     # coarse-stage trials
  fine_n: 25                       # total 40 trials, p_hat resolution = 0.025
  coarse_range: [0.3, 0.7]       # coarse screening interval
  fine_range: [0.45, 0.55]         # final boundary interval

judge:
  type: "constraint"                 # "keyword", "llm_api", or "constraint"
