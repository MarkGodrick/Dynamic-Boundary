# CoT-enabled profiles for the small paired judge diagnostic.
#
# This file deliberately leaves configs/rebuttal/judge_bias.yaml unchanged.
# The same production JUDGE_TEMPLATES are used; only inference-time reasoning
# is enabled. Prices match the no-CoT config snapshot from 2026-07-27.

judges:
  deepseek_v4_flash_cot:
    model: "deepseek-v4-flash"
    api_key_env: "DEEPSEEK_API_TOKEN"
    base_url: "https://api.deepseek.com"
    temperature: null
    max_tokens: 4096
    max_retries: 8
    retry_delay: 0.5
    extra_body:
      thinking:
        type: "enabled"
      reasoning_effort: "high"
    prices_usd_per_million:
      input: 0.14
      input_cache_hit: 0.0028
      input_cache_miss: 0.14
      output: 0.28

  openai_gpt_5_4_mini_cot:
    model: "openai/gpt-5.4-mini"
    api_key_env: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    temperature: null
    max_tokens: 4096
    max_retries: 8
    retry_delay: 0.5
    extra_body:
      reasoning:
        effort: "medium"
        exclude: false
      provider:
        order:
          - "OpenAI"
        allow_fallbacks: false
    prices_usd_per_million:
      input: 0.75
      input_cache_hit: 0.075
      input_cache_miss: 0.75
      output: 4.5

  anthropic_claude_haiku_4_5_cot:
    model: "anthropic/claude-haiku-4.5"
    api_key_env: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    temperature: null
    max_tokens: 4096
    max_retries: 8
    retry_delay: 0.5
    extra_body:
      reasoning:
        max_tokens: 2048
        exclude: false
      provider:
        order:
          - "Anthropic"
        allow_fallbacks: false
    prices_usd_per_million:
      input: 1.0
      input_cache_hit: 0.1
      input_cache_miss: 1.0
      output: 5.0
